# fly.toml app configuration file generated for mcp-todo-discord
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "mcp-todo-discord"
primary_region = "iad"

[build]

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

[mounts]
  source = "mcp_todo_data"
  destination = "/data"
  initial_size = "1gb"